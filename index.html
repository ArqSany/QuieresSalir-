<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Quieres tener una cita conmigo?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --rose:#d9628a; --rose-soft:#fbd9e4; --blush:#fff5f7; --wine:#74304a; --mauve:#a0607a; --line:#f1cfdc; --peach:#ffe1d8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;font-family:'DM Sans',system-ui,sans-serif;color:var(--wine);
  background:linear-gradient(180deg,#fff 0%,#fff3f6 60%,#ffeaf0 100%);background-color:#fff5f7;
  display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-x:hidden;position:relative;
}
.blob{position:fixed;border-radius:50%;z-index:0;pointer-events:none}
.b1{width:420px;height:420px;right:-140px;top:-170px;background:radial-gradient(circle at 40% 60%,#ffd3e0,#ffe3ea)}
.b2{width:360px;height:360px;left:-130px;bottom:-190px;background:radial-gradient(circle at 60% 40%,var(--peach),#fff0ec)}
.deco{position:fixed;z-index:0;pointer-events:none;color:var(--rose);opacity:.35}
.deco svg{display:block;width:100%;height:100%;fill:currentColor}

.card{
  position:relative;z-index:1;width:100%;max-width:690px;background:#fff;border-radius:36px;padding:12px;
  box-shadow:0 25px 70px rgba(217,98,138,.18);
}
.inner{
  border:1px solid var(--line);border-radius:28px;padding:44px 40px 34px;text-align:center;
  background:radial-gradient(circle at 50% 18%,#fffafb,#fff 70%);min-height:420px;
  display:flex;flex-direction:column;align-items:center;
}
.divider{display:flex;align-items:center;gap:10px;color:var(--rose);margin-bottom:22px}
.divider i{display:block;width:50px;height:1px;background:var(--rose);opacity:.45}
.divider svg{width:14px;height:14px;fill:currentColor}
.badge{
  width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--blush);
  display:grid;place-items:center;color:var(--rose);margin-bottom:22px;box-shadow:0 0 30px rgba(217,98,138,.25);
}
.badge svg{width:24px;height:24px;fill:currentColor}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--rose);margin:0 0 14px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(32px,7vw,56px);line-height:1.1;margin:0 0 14px;color:var(--wine)}
.sub{margin:0 auto 28px;max-width:34ch;font-size:15px;line-height:1.6;color:var(--mauve)}

/* Botones */
.answers{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:56px}
.btn{
  font:700 16px 'DM Sans',sans-serif;border:0;border-radius:999px;padding:15px 38px;cursor:pointer;
  transition:transform .15s ease,box-shadow .15s ease;
}
.btn:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
.yes{background:linear-gradient(135deg,#ec7ca0,var(--rose));color:#fff;box-shadow:0 10px 24px rgba(217,98,138,.4)}
.yes:hover{transform:translateY(-2px) scale(1.04)}
.no{background:#fff;color:var(--mauve);border:1px solid var(--line)}
.no-slot{display:inline-block}
.no.flying{position:fixed;z-index:20;margin:0;transition:left .45s cubic-bezier(.3,1.4,.5,1),top .45s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.no.gone{opacity:0;pointer-events:none}
.oops{margin:22px 0 0;font-family:'Playfair Display',serif;font-style:italic;font-size:19px;color:var(--rose);min-height:28px}

/* Detalles */
.details{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;width:100%;margin:6px 0 26px;text-align:left}
.field.full{grid-column:1/-1}
.field span{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mauve);margin:0 0 6px 4px}
.field div{border:1px solid var(--line);border-radius:999px;padding:14px 20px;background:#fffdfd;font-size:16px;color:var(--wine)}
.map{grid-column:1/-1;display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:22px;padding:10px 18px 10px 10px;background:var(--blush);transition:transform .15s ease,box-shadow .15s ease}
.map:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(217,98,138,.18)}
.map:focus-visible{outline:3px solid var(--wine);outline-offset:3px}
.map-thumb{flex:none;width:64px;height:64px;border-radius:16px;display:grid;place-items:center;color:var(--rose);background:linear-gradient(90deg,transparent 46%,#fff 46% 54%,transparent 54%),linear-gradient(0deg,transparent 58%,#fff 58% 66%,transparent 66%),linear-gradient(135deg,#ffe8ee,#ffdce7)}
.map-thumb svg{width:26px;height:26px;fill:currentColor;filter:drop-shadow(0 3px 4px rgba(217,98,138,.4))}
.map-txt{min-width:0;display:flex;flex-direction:column;gap:2px}
.map-txt small{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mauve)}
.map-txt strong{font-size:15px;font-weight:500;color:var(--wine);overflow-wrap:anywhere}
.map-txt em{font-family:'Playfair Display',serif;font-size:13px;color:var(--rose)}
.mapbox{grid-column:1/-1;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--blush)}
.mapbox iframe{display:block;width:100%;height:220px;border:0}
.map-cap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;font-size:14px;color:var(--wine)}
.map-cap a{flex:none;font-family:'Playfair Display',serif;font-style:italic;font-size:13px;color:var(--rose);text-decoration:none}
.map-cap a:hover{text-decoration:underline}
.footer{margin:0;font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:16px;color:var(--rose)}
.footer b{font-style:normal;font-weight:400;opacity:.7;margin:0 8px}

.hidden{display:none!important}
#accepted{animation:pop .6s ease both;display:flex;flex-direction:column;align-items:center;width:100%}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.confetti{position:fixed;z-index:60;pointer-events:none;color:var(--rose);animation:fall linear forwards}
.confetti svg{width:100%;height:100%;fill:currentColor;display:block}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
/* Transición: corazón que se abre */
#reveal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;cursor:pointer;opacity:0;
  background:radial-gradient(circle at 50% 45%,#fff6f8,#ffd9e5 75%);background-color:#ffe3ec}
#reveal.play{display:flex;animation:rfade .4s forwards}
#reveal.out{animation:rfadeout .9s ease-in forwards}
.heartbox{--S:min(68vw,300px);position:relative;width:var(--S);height:var(--S);perspective:900px}
.half{position:absolute;top:0;width:50%;height:100%;overflow:hidden;backface-visibility:hidden;z-index:2}
.half.l{left:0;transform-origin:left center}
.half.r{right:0;transform-origin:right center}
.half svg{position:absolute;top:0;width:200%;height:100%;fill:var(--rose)}
.half.l svg{left:0}.half.r svg{right:0}

#reveal.play .heartbox{animation:beat 1.1s ease-in-out}
#reveal.play .half.l{animation:openL .9s cubic-bezier(.6,0,.3,1) 1.25s forwards}
#reveal.play .half.r{animation:openR .9s cubic-bezier(.6,0,.3,1) 1.25s forwards}
#reveal.play #face{animation:emerge .9s cubic-bezier(.2,1.3,.4,1) 1.4s forwards,sprite var(--sprite,3.5s) steps(14) 1.4s forwards}
#reveal.out .heartbox{animation:zoomout .9s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes rfade{to{opacity:1}}
@keyframes rfadeout{from{opacity:1}to{opacity:0}}
@keyframes beat{0%,60%,100%{transform:scale(1)}15%,45%{transform:scale(1.14)}30%{transform:scale(1)}}
@keyframes openL{to{transform:rotateY(-110deg)}}
@keyframes openR{to{transform:rotateY(110deg)}}
@keyframes emerge{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}50%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}}
@keyframes zoomout{from{transform:scale(1)}to{transform:scale(3.6)}}
@keyframes sprite{from{background-position:0 0}to{background-position:100% 0}}
/* Retrato decorativo (estático) en la carta */
.aceptada .badge{display:none}
.retrato-wrap{position:relative;width:210px;height:163px;margin:10px auto 10px}
.corazon{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 12px 20px rgba(217,98,138,.32))}
.retrato{position:absolute;left:50%;top:-16px;width:160px;height:160px;transform:translateX(-50%);object-fit:contain;filter:drop-shadow(0 6px 10px rgba(116,48,74,.25))}
.mini{position:absolute;width:16px;height:16px;fill:var(--rose);opacity:.55}
.m1{left:-8px;top:18px}.m2{right:-6px;bottom:30px;width:12px;height:12px}
@media(max-width:520px){.retrato-wrap{width:180px;height:139px}}
/* Cupidos que abren paso: giran sobre un eje abajo al centro */
.cupids{position:absolute;left:50%;bottom:env(safe-area-inset-bottom,0px);width:0;height:0;pointer-events:none;z-index:3}
.arm{position:absolute;left:0;bottom:0;width:0;height:var(--R,150px);transform-origin:50% 100%}
.cpos{position:absolute;left:0;top:0;width:var(--cs,96px);height:var(--cs,96px);margin:calc(var(--cs,96px)/-2) 0 0 calc(var(--cs,96px)/-2)}
.cpop{width:100%;height:100%}
.cupid-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(217,98,138,.3))}
.arm.r .cupid-svg{transform:scaleX(-1)}
.cupid-img{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(217,98,138,.3));-webkit-user-drag:none;user-select:none}
#reveal.espejo .arm.r .cupid-img{transform:scaleX(-1)}
.arm.l{transform:rotate(calc(var(--a0,14deg)*-1))}
.arm.r{transform:rotate(var(--a0,14deg))}
.arm.l .cpos{transform:rotate(var(--a0,14deg))}
.arm.r .cpos{transform:rotate(calc(var(--a0,14deg)*-1))}
.wing{transform-box:fill-box}.wl{transform-origin:100% 80%}.wr{transform-origin:0 80%}
#reveal.play .arm.l{animation:armL .9s cubic-bezier(.6,0,.3,1) 1.25s both}
#reveal.play .arm.r{animation:armR .9s cubic-bezier(.6,0,.3,1) 1.25s both}
#reveal.play .arm.l .cpos{animation:posL .9s cubic-bezier(.6,0,.3,1) 1.25s both}
#reveal.play .arm.r .cpos{animation:posR .9s cubic-bezier(.6,0,.3,1) 1.25s both}
#reveal.play .cpop{animation:cpop .55s cubic-bezier(.2,1.5,.4,1) .2s both}
#reveal.play .wl{animation:flapL .45s ease-in-out infinite alternate}
#reveal.play .wr{animation:flapR .45s ease-in-out infinite alternate}
@keyframes armL{from{transform:rotate(calc(var(--a0)*-1))}to{transform:rotate(calc(var(--a1)*-1))}}
@keyframes armR{from{transform:rotate(var(--a0))}to{transform:rotate(var(--a1))}}
@keyframes posL{from{transform:rotate(var(--a0))}to{transform:rotate(calc(var(--a1) - 10deg))}}
@keyframes posR{from{transform:rotate(calc(var(--a0)*-1))}to{transform:rotate(calc(var(--a1)*-1 + 10deg))}}
@keyframes cpop{from{opacity:0;transform:scale(.3) translateY(30px)}to{opacity:1;transform:none}}
@keyframes flapL{from{transform:rotate(0)}to{transform:rotate(-10deg)}}
@keyframes flapR{from{transform:rotate(0)}to{transform:rotate(10deg)}}
@media(max-width:520px){.inner{padding:34px 20px 28px}.details{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ==========================================================
   ✏️  EDITA AQUÍ  (todo lo que puedes cambiar está en este bloque)
   ----------------------------------------------------------
   nombre: el nombre de ella (si lo dejas vacío "", no aparece)
   fecha: formato AAAA-MM-DD   (ejemplo: "2026-10-24")
   hora:  formato 24 horas HH:MM (ejemplo: "19:30" = 7:30 PM)
   lugar: el texto que quieras
   direccion: la dirección escrita tal como sale en Google Maps.
              El mapa se muestra dentro de la carta. Si la dejas vacía "", no aparece
   ----------------------------------------------------------
   CUPIDOS (los dos que abren paso en la transición)
   cupido: el LINK de tu dibujo, o el nombre de un archivo subido junto a
           este mismo archivo (ejemplo: "cupido.png").
           Ideal: PNG con fondo transparente, de unos 500 px.
           Si lo dejas vacío "", se usa el cupido dibujado por defecto.
           Si el link no carga, también se usa el de por defecto.
   cupidoEspejo: true  = el cupido de la derecha se voltea para mirar al centro
                 false = los dos se ven igual (ponlo así si tu dibujo es simétrico)
   cupidoTamano: 1 = normal, 1.3 = más grande, 0.8 = más chico
   (El movimiento de giro ya está en el código; tú solo pones el dibujo.)
   ========================================================== */
const CITA = {
  nombre: "Juan Pablo mi amor",
  fecha: "2026-10-24",
  hora:  "19:30",
  lugar: "Nuestro café favorito",
  direccion: "C. la Ballena, 5, 6, 35660 Corralejo, Las Palmas, Spain"   // ← pega aquí la dirección
};

const ILUSTRACIONES = {
  cupido: "",           // ← pega aquí el link o nombre de archivo de TU cupido ("" = el de por defecto)
  cupidoEspejo: true,   // true: el de la derecha se voltea para mirar al centro
  cupidoTamano: 1       // 1 = normal · 1.3 = más grande · 0.8 = más chico
};
/* ========================================================== */

const $ = id => document.getElementById(id);
const no = $('no'), slot = $('slot');
let intentos = 0;

/* Pone el nombre en la pregunta */
if (CITA.nombre && CITA.nombre.trim()) {
  $('pregunta').textContent = `${CITA.nombre.trim()}, ¿quisieras tener una cita conmigo?`;
}

function formatear(){
  const [y,m,d] = CITA.fecha.split('-').map(Number);
  const f = new Date(y, m-1, d).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('d-date').textContent = f.charAt(0).toUpperCase() + f.slice(1);
  const [h,mi] = CITA.hora.split(':').map(Number);
  $('d-time').textContent = `${((h+11)%12)+1}:${String(mi).padStart(2,'0')} ${h<12?'AM':'PM'}`;
  $('d-place').textContent = CITA.lugar;
  const dir = (CITA.direccion || '').trim();
  if (dir) {
    const q = encodeURIComponent(dir);
    const iframeSrc = (dir.match(/src="([^"]+)"/) || [])[1];            // código <iframe> pegado
    const embed = iframeSrc || (/google\.[a-z.]+\/maps\/embed/i.test(dir) ? dir : null); // enlace de inserción
    const esLink = /^https?:\/\//i.test(dir);
    const frame = $('d-frame');
    if (embed) {
      frame.src = embed;
      $('d-addr').textContent = 'Ubicación de la cita';
      $('d-link').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(CITA.lugar);
    } else if (esLink) {
      frame.remove();
      $('d-addr').textContent = 'Ubicación de la cita';
      $('d-link').href = dir;
    } else {
      frame.src = 'https://maps.google.com/maps?q=' + q + '&z=16&output=embed';
      $('d-addr').textContent = dir;
      $('d-link').href = 'https://www.google.com/maps/search/?api=1&query=' + q;
    }
    $('d-map').classList.remove('hidden');
  }
}

function moverNo(){
  const w = no.offsetWidth, h = no.offsetHeight, pad = 12;
  const maxX = document.documentElement.clientWidth - w - pad;
  const maxY = window.innerHeight - h - pad;
  const cx = parseFloat(no.style.left) || 0, cy = parseFloat(no.style.top) || 0;
  let x, y, t = 0;
  do {
    x = pad + Math.random()*(maxX-pad);
    y = pad + Math.random()*(maxY-pad);
    t++;
  } while (t < 15 && Math.hypot(x-cx, y-cy) < 150);
  no.style.left = x + 'px';
  no.style.top = y + 'px';
}

no.addEventListener('click', () => {
  intentos++;
  if (intentos === 1) {
    const r = no.getBoundingClientRect();
    slot.style.width = r.width + 'px';
    slot.style.height = r.height + 'px';
    no.style.left = r.left + 'px';
    no.style.top = r.top + 'px';
    no.classList.add('flying');
    void no.offsetWidth;
    moverNo();
  } else if (intentos === 2) {
    moverNo();
  } else {
    no.classList.add('gone');
    $('oops').textContent = 'uy parece que se escapó…';
    setTimeout(() => { no.style.display = 'none'; }, 350);
    $('yes').focus();
  }
});

function confeti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div');
    const s = 10 + Math.random()*16;
    el.className = 'confetti';
    el.style.cssText = `left:${Math.random()*100}vw;top:-30px;width:${s}px;height:${s}px;opacity:${.4+Math.random()*.5};animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*.8}s`;
    el.innerHTML = '<svg viewBox="0 0 24 24"><use href="#heart"/></svg>';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 7500);
  }
}

/* Duración en segundos de tu animación (el video original dura 3.75) */
const ANIM_SEG = 3.75;

/* Si pusiste tu propio cupido, reemplaza al dibujado. Si el link falla, se queda el de por defecto */
function aplicarCupido(){
  const ov = $('reveal');
  if (ILUSTRACIONES.cupidoEspejo !== false) ov.classList.add('espejo');
  const url = (ILUSTRACIONES.cupido || '').trim();
  if (!url) return;
  ov.querySelectorAll('.cpop').forEach(caja => {
    const original = caja.innerHTML;
    const img = new Image();
    img.className = 'cupid-img'; img.alt = ''; img.draggable = false;
    img.onerror = () => { caja.innerHTML = original; };
    img.src = url;                      // empieza a cargar desde ya
    caja.innerHTML = '';
    caja.appendChild(img);
  });
}
aplicarCupido();

/* Calcula el tamaño y el recorrido de los cupidos según la pantalla */
function prepararCupidos(ov){
  const vw = innerWidth, vh = innerHeight;
  const S = Math.min(vw * 0.68, 300);                       // tamaño del corazón
  const cs = Math.max(168, Math.min(vw * 0.60, 300)) * (Number(ILUSTRACIONES.cupidoTamano) || 1);   // tamaño de cada cupido
  const xFin = vw / 2 - cs * 0.30, yFin = cs * 0.45;        // esquina inferior donde quedan (un poco recortados por el borde)
  const R = Math.min(Math.hypot(xFin, yFin), vh * 0.5);     // largo del brazo que gira
  const a1 = Math.acos(Math.min(1, yFin / R)) * 180 / Math.PI;
  const yIni = Math.max(cs * 0.3, vh / 2 - S * 0.58 - cs * 0.18);   // altura de salida, casi sin tapar el corazón
  const a0 = Math.min(a1 - 6, Math.max(10, Math.acos(Math.min(1, yIni / R)) * 180 / Math.PI));
  const st = ov.style;
  st.setProperty('--cs', cs.toFixed(0) + 'px');
  st.setProperty('--R', R.toFixed(0) + 'px');
  st.setProperty('--a0', a0.toFixed(1) + 'deg');
  st.setProperty('--a1', a1.toFixed(1) + 'deg');
}
let listo = false;
function mostrarCarta(){
  if (listo) return;
  listo = true;
  $('accepted').classList.remove('hidden');
  confeti();
  const ov = $('reveal');
  ov.classList.add('out');
  setTimeout(() => ov.remove(), 1000);
}

$('yes').addEventListener('click', () => {
  formatear();
  no.style.display = 'none';
  $('ask').classList.add('hidden');
  document.querySelector('.inner').classList.add('aceptada');
  const ov = $('reveal');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    listo = true; ov.remove();
    $('accepted').classList.remove('hidden');
    return;
  }
  prepararCupidos(ov);
  ov.classList.add('play');
  setTimeout(() => { if (!listo) confeti(); }, 1900);   // corazoncitos cuando se abre
  ov.style.setProperty('--sprite', (ANIM_SEG * 14 / 15).toFixed(3) + 's');
  setTimeout(mostrarCarta, (1.4 + ANIM_SEG + 0.6) * 1000);   // la carta aparece al terminar tu animación                        // duración total de la animación
  ov.addEventListener('click', mostrarCarta);            // tocar para saltar
});
</script>
